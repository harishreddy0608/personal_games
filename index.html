<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#0f1a0f" />
<title>Retro Arcade</title>
<link rel="manifest" href="manifest.webmanifest" />
<link rel="apple-touch-icon" href="icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Arcade" />
<style>
  :root {
    --bg: #0f1a0f;
    --panel: #1b2a1b;
    --lcd: #9bbc0f;
    --lcd-dim: #306230;
    --accent: #8bac0f;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    min-height: 100%;
    background: var(--bg);
    color: var(--lcd);
    font-family: "Courier New", monospace;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    -webkit-user-select: none;
    user-select: none;
  }
  .shell {
    width: 100%;
    max-width: 520px;
    text-align: center;
  }
  .logo {
    font-size: clamp(28px, 9vw, 44px);
    font-weight: bold;
    letter-spacing: 6px;
    color: var(--accent);
    text-transform: uppercase;
    margin: 0 0 4px;
  }
  .tagline {
    font-size: 12px;
    letter-spacing: 2px;
    opacity: 0.6;
    margin-bottom: 28px;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 16px;
  }
  .card {
    display: block;
    text-decoration: none;
    color: inherit;
    background: var(--panel);
    border-radius: 14px;
    padding: 20px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.5), inset 0 0 0 2px #26381f;
    transition: transform 120ms ease, box-shadow 120ms ease;
  }
  .card:hover, .card:focus {
    transform: translateY(-3px);
    box-shadow: 0 12px 30px rgba(0,0,0,0.6), inset 0 0 0 2px #3a5230;
    outline: none;
  }
  .card:active { transform: translateY(-1px); }
  .thumb {
    width: 100%;
    aspect-ratio: 1 / 1;
    border-radius: 10px;
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .thumb.snake { background: #9bbc0f; }
  .thumb.p2048 { background: #bbada0; }
  .thumb svg { width: 78%; height: 78%; }
  .card .name {
    font-size: 20px;
    font-weight: bold;
    letter-spacing: 3px;
    text-transform: uppercase;
  }
  .card .desc {
    font-size: 12px;
    opacity: 0.7;
    margin-top: 6px;
    line-height: 1.5;
  }
  .install {
    margin-top: 28px;
    font-size: 11px;
    opacity: 0.55;
    line-height: 1.7;
  }
  #installBtn {
    display: none;
    margin: 18px auto 0;
    background: var(--accent);
    color: #0f1a0f;
    border: none;
    border-radius: 8px;
    padding: 10px 18px;
    font-family: inherit;
    font-weight: bold;
    letter-spacing: 1px;
    cursor: pointer;
  }
</style>
</head>
<body>
  <div class="shell">
    <h1 class="logo">Arcade</h1>
    <div class="tagline">TWO GAMES &bull; ONE SCREEN</div>

    <div class="grid">
      <a class="card" href="snake.html">
        <div class="thumb snake">
          <!-- little coiled snake -->
          <svg viewBox="0 0 100 100" aria-hidden="true">
            <path d="M20 72 Q20 50 42 50 Q64 50 64 34 Q64 22 50 22"
                  fill="none" stroke="#0f380f" stroke-width="12"
                  stroke-linecap="round" stroke-linejoin="round"/>
            <circle cx="50" cy="22" r="8" fill="#1b4d1b"/>
            <circle cx="52" cy="19" r="2" fill="#f4f7d0"/>
            <circle cx="28" cy="78" r="6" fill="#0f380f"/>
          </svg>
        </div>
        <div class="name">Snake</div>
        <div class="desc">Slither, grab eggs, smash rocks</div>
      </a>

      <a class="card" href="2048.html">
        <div class="thumb p2048">
          <!-- 2048 tile -->
          <svg viewBox="0 0 100 100" aria-hidden="true">
            <rect x="12" y="12" width="76" height="76" rx="8" fill="#edc22e"/>
            <text x="50" y="50" text-anchor="middle" dominant-baseline="central"
                  font-family="Arial, sans-serif" font-weight="800"
                  font-size="26" fill="#f9f6f2">2048</text>
          </svg>
        </div>
        <div class="name">2048</div>
        <div class="desc">Slide, merge, reach 2048</div>
      </a>
    </div>

    <button id="installBtn">Install app</button>

    <div class="install">
      Tip: on your phone, open the browser menu and choose<br />
      &ldquo;Add to Home Screen&rdquo; to install this as an app.
    </div>
  </div>

<script>
  // Register the service worker for offline play.
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("sw.js").catch(() => {});
    });
  }

  // Custom install button (Android/desktop Chrome). iOS uses Add to Home Screen.
  let deferredPrompt = null;
  const installBtn = document.getElementById("installBtn");
  window.addEventListener("beforeinstallprompt", (e) => {
    e.preventDefault();
    deferredPrompt = e;
    installBtn.style.display = "block";
  });
  installBtn.addEventListener("click", async () => {
    if (!deferredPrompt) return;
    deferredPrompt.prompt();
    await deferredPrompt.userChoice;
    deferredPrompt = null;
    installBtn.style.display = "none";
  });
</script>
</body>
</html>
